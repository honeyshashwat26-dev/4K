<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UltraPixel Studio</title>
<style>
:root{--bg:#090b12;--card:#121622;--card2:#191e2d;--border:#ffffff18;--text:#f5f7ff;--muted:#9ca5bb;--a:#7c5cff;--b:#00d4ff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:var(--text);background:radial-gradient(circle at top left,#1b1640,transparent 35%),var(--bg)}
header{padding:18px 24px;font-weight:800;font-size:21px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#090b12dd;backdrop-filter:blur(15px);z-index:5}.logo span{color:var(--b)}
main{max-width:1400px;margin:auto;padding:20px}.workspace{display:grid;grid-template-columns:1fr 360px;gap:20px}.card,.panel{background:#121622e8;border:1px solid var(--border);border-radius:22px}.card{min-height:70vh;overflow:hidden}.top{padding:15px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.muted{color:var(--muted);font-size:13px}.stage{min-height:550px;display:flex;align-items:center;justify-content:center;padding:20px;background:#0d1018}.empty{text-align:center;color:var(--muted)}canvas{max-width:100%;max-height:70vh;border-radius:8px;box-shadow:0 20px 80px #0008}.panel{padding:18px}.section{margin-bottom:22px}.title{font-weight:bold;margin-bottom:11px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}button,.file{border:1px solid var(--border);background:var(--card2);color:#fff;padding:12px;border-radius:13px;font-size:14px;cursor:pointer;text-align:center}button:hover,.file:hover{border-color:var(--a)}.primary{background:linear-gradient(135deg,var(--a),#9b6cff);border:0;font-weight:bold}.cyan{background:linear-gradient(135deg,#009dff,var(--b));border:0;color:#00151d;font-weight:bold}.active{background:linear-gradient(135deg,var(--a),#5740e8);border:0}.file input{display:none}.control{margin:14px 0}.chead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:6px}input[type=range]{width:100%;accent-color:var(--a)}
.camera{display:none;position:fixed;inset:0;background:#000;z-index:20;flex-direction:column}.camera.on{display:flex}video{width:100%;height:calc(100vh - 90px);object-fit:cover}.camctrl{height:90px;display:flex;justify-content:center;align-items:center;gap:15px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,100px);background:#202738;padding:12px 18px;border-radius:14px;border:1px solid var(--border);transition:.3s;z-index:30}.toast.show{transform:translate(-50%,0)}
@media(max-width:900px){.workspace{grid-template-columns:1fr}.card{min-height:50vh}.stage{min-height:400px}}
</style></head><body>
<header><div class="logo">Ultra<span>Pixel</span> Studio</div></header>
<main><div class="workspace"><div class="card"><div class="top"><div><b id="name">No image selected</b><div class="muted" id="info">Upload an image or use the camera</div></div><div class="muted" id="status">Ready</div></div><div class="stage"><div class="empty" id="empty"><b style="display:block;color:#fff;font-size:22px;margin-bottom:8px">Ultra Resolution Editor</b>Upload or capture a photo to begin.</div><canvas id="canvas"></canvas></div></div>
<div class="panel">
<div class="section"><div class="title">Image</div><div class="grid"><label class="file">📁 Upload<input id="file" type="file" accept="image/*"></label><button class="cyan" id="open">📷 Camera</button></div></div>
<div class="section"><div class="title">Export Resolution</div><div class="grid" id="res"><button class="active" data-r="2048">2K</button><button data-r="4096">4K</button><button data-r="7680">8K</button><button data-r="15360">16K</button></div></div>
<div class="section"><div class="title">Adjustments</div><div id="controls"></div></div>
<div class="section"><div class="title">Quick Filters</div><div class="grid" id="presets"><button data-p="normal">Normal</button><button data-p="vivid">Vivid</button><button data-p="cinema">Cinema</button><button data-p="bw">B&W</button><button data-p="vintage">Vintage</button><button data-p="cool">Cool</button></div></div>
<div class="section"><div class="grid"><button id="reset">↺ Reset</button><button class="primary" id="export">⬇ Export PNG</button></div></div></div></div></main>
<div class="camera" id="cam"><video id="video" autoplay playsinline></video><div class="camctrl"><button id="close">Cancel</button><button class="primary" id="capture">📸 Capture</button></div></div><div class="toast" id="toast"></div>
<script>
const C=document.querySelector('#canvas'),ctx=C.getContext('2d'),S={img:null,r:2048,brightness:100,contrast:100,saturation:100,hue:0,blur:0,sepia:0,grayscale:0};
const specs=[['brightness','Brightness',0,200,100,1,'%'],['contrast','Contrast',0,200,100,1,'%'],['saturation','Saturation',0,250,100,1,'%'],['hue','Hue',-180,180,0,1,'°'],['blur','Blur',0,20,0,.1,'px'],['sepia','Sepia',0,100,0,1,'%'],['grayscale','Grayscale',0,100,0,1,'%']];
controls.innerHTML=specs.map(x=>`<div class="control"><div class="chead"><span>${x[1]}</span><span id="${x[0]}V">${x[4]}${x[6]}</span></div><input type="range" id="${x[0]}" min="${x[2]}" max="${x[3]}" value="${x[4]}" step="${x[5]}"></div>`).join('');
const toast=t=>{let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),3500)};
function filter(){return `brightness(${S.brightness}%) contrast(${S.contrast}%) saturate(${S.saturation}%) hue-rotate(${S.hue}deg) blur(${S.blur}px) sepia(${S.sepia}%) grayscale(${S.grayscale}%)`}
function render(){if(!S.img)return;C.width=S.img.naturalWidth||S.img.width;C.height=S.img.naturalHeight||S.img.height;ctx.clearRect(0,0,C.width,C.height);ctx.filter=filter();ctx.drawImage(S.img,0,0,C.width,C.height);ctx.filter='none'}
function load(src,n='Camera Capture'){let i=new Image;i.onload=()=>{S.img=i;empty.style.display='none';name.textContent=n;info.textContent=`${i.naturalWidth} × ${i.naturalHeight} pixels`;render();toast('Image loaded successfully')};i.src=src}
file.onchange=e=>{let f=e.target.files[0];if(f)load(URL.createObjectURL(f),f.name)};
specs.forEach(x=>document.querySelector('#'+x[0]).oninput=e=>{S[x[0]]=+e.target.value;document.querySelector('#'+x[0]+'V').textContent=e.target.value+x[6];render()});
res.onclick=e=>{if(!e.target.dataset.r)return;[...res.children].forEach(b=>b.classList.remove('active'));e.target.classList.add('active');S.r=+e.target.dataset.r;toast(e.target.textContent+' export selected')};
const P={normal:[100,100,100,0,0,0,0],vivid:[108,120,155,0,0,0,0],cinema:[92,135,82,-8,0,12,0],bw:[105,125,0,0,0,0,100],vintage:[105,88,75,-8,0,42,0],cool:[100,110,115,18,0,0,0]};
function apply(a){specs.forEach((x,i)=>{S[x[0]]=a[i];document.querySelector('#'+x[0]).value=a[i];document.querySelector('#'+x[0]+'V').textContent=a[i]+x[6]});render()}
presets.onclick=e=>{if(e.target.dataset.p){apply(P[e.target.dataset.p]);status.textContent=e.target.textContent+' filter'}};
reset.onclick=()=>{apply(P.normal);toast('Reset complete')};
export.onclick=()=>{if(!S.img)return toast('Upload or capture an image first');let w=S.img.naturalWidth,h=S.img.naturalHeight;if(w>=h)h=Math.round(S.r*h/w),w=S.r;else w=Math.round(S.r*w/h),h=S.r;if(w>32767||h>32767)return toast('Resolution exceeds browser canvas limit');toast(`Rendering ${w} × ${h}...`);setTimeout(()=>{try{let o=document.createElement('canvas');o.width=w;o.height=h;let x=o.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.filter=filter();x.drawImage(S.img,0,0,w,h);o.toBlob(b=>{if(!b)return toast('Export failed; try lower resolution');let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`UltraPixel-${S.r}-${Date.now()}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Export complete!')},'image/png')}catch(err){toast('Not enough memory. Try a lower resolution.')}},50)};
let stream=null;open.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:7680},height:{ideal:4320}},audio:false});video.srcObject=stream;cam.classList.add('on')}catch(e){toast('Camera failed. Use HTTPS/localhost and allow permission.')}};
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;cam.classList.remove('on')}close.onclick=stop;
capture.onclick=()=>{if(!video.videoWidth)return toast('Camera is starting...');let o=document.createElement('canvas');o.width=video.videoWidth;o.height=video.videoHeight;o.getContext('2d').drawImage(video,0,0);let d=o.toDataURL('image/png');stop();load(d,'Camera Capture')};
</script></body></html>
